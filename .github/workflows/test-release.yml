name: Test Release

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DALAMUD_HOME: /tmp/dalamud
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          mkdir -p $DALAMUD_HOME
          curl -L https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -o /tmp/dalamud.zip
          unzip /tmp/dalamud.zip -d $DALAMUD_HOME

      - name: Build
        run: dotnet build -c Release RpUtils/RpUtils.csproj

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          prerelease: true
          files: RpUtils/bin/Release/RpUtilsPreview/latest.zip
