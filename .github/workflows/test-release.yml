name: Test Release

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DALAMUD_HOME: /tmp/dalamud
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          mkdir -p $DALAMUD_HOME
          curl -L https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -o /tmp/dalamud.zip
          unzip /tmp/dalamud.zip -d $DALAMUD_HOME

      - name: Build
        run: dotnet build -c Release -p:PluginVersion=0.6.0.${{ github.run_number }} RpUtils/RpUtils.csproj

      - name: Build test repo manifest
        env:
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/test/latest.zip
        run: |
          jq "[ . + {DownloadLinkInstall: \"$DOWNLOAD_URL\", DownloadLinkUpdate: \"$DOWNLOAD_URL\", DownloadLinkTesting: \"$DOWNLOAD_URL\"} ]" \
            RpUtils/bin/Release/RpUtilsPreview/RpUtilsPreview.json \
            > RpUtils/bin/Release/RpUtilsPreview/RpUtilsTesting.json

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          prerelease: true
          files: |
            RpUtils/bin/Release/RpUtilsPreview/latest.zip
            RpUtils/bin/Release/RpUtilsPreview/RpUtilsTesting.json
